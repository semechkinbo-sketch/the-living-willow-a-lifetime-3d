<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Living Willow: A Lifetime 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene-wrap">
	<div id="stage">
		<canvas id="scene"></canvas>
		<div id="title">
			<h1>The Living Willow</h1>
			<p>A Lifetime · 3D</p>
		</div>
		<div id="hint">Hold the ground by the roots to grow the willow · a second finger makes it young again · drag to walk around it · tap the sun for night, the moon for day · the storm cloud brings rain and snow</div>
		<div id="coach">Hold the ground by the roots to grow the willow</div>
		<div id="seasons" role="group" aria-label="Seasons">
			<button data-season="0" class="chip">Spring</button>
			<button data-season="1" class="chip">Summer</button>
			<button data-season="2" class="chip">Autumn</button>
			<button data-season="3" class="chip">Winter</button>
		</div>
	</div>
</div>
<script src="script.js"></script>
</body>
</html>
